---
- name: Reset AD User Password
  hosts: AD
  gather_facts: no

  vars_prompt:
    - name: target_user
      prompt: "Digite o sAMAccountName (ex: luffy.monkey)"
      private: no
    - name: new_password
      prompt: "Digite a nova senha temporária"
      private: yes

  tasks:
    - name: 1. Buscar usuário usando Filtro (sAMAccountName)
      microsoft.ad.object_info:
        # O filtro é mais robusto para encontrar usuários pelo login
        filter: "sAMAccountName -eq '{{ target_user }}'"
      register: ad_user_info

    # ESTA TAREFA VAI TE MOSTRAR O QUE O AD VIU
    - name: 2. DEBUG - Ver retorno do AD
      debug:
        var: ad_user_info

    - name: 3. Interromper se a lista de objetos estiver vazia
      fail:
        msg: "ERRO: O usuário '{{ target_user }}' não foi retornado na busca do AD."
      when: ad_user_info.objects | length == 0

    - name: 4. Reset password e forçar troca no primeiro login
      microsoft.ad.user:
        # Usamos o Distinguished Name encontrado para garantir que estamos no objeto certo
        identity: "{{ ad_user_info.objects[0].distinguished_name }}"
        password: "{{ new_password }}"
        update_password: always
        password_expired: yes
        account_locked: no
        state: present
      register: password_result

    - name: 5. Mostrar resultado final
      debug:
        msg: "Senha resetada com sucesso para '{{ target_user }}'. Troca obrigatória no próximo logon."
      when: password_result.changed
