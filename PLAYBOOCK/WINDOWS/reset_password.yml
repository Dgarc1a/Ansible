---
- name: Reset AD User Password
  hosts: AD
  gather_facts: no

  vars_prompt:
    - name: target_user
      prompt: "Digite o username do AD a resetar (ex: d.garcia)"
      private: no

    - name: new_password
      prompt: "Digite a nova senha"
      private: yes

  tasks:
    - name: Consultar informações do usuário no AD
      microsoft.ad.object_info:
        identity: "{{ target_user }}"
      register: ad_user_info

    - name: Validar se o usuário foi encontrado
      fail:
        msg: "O usuário '{{ target_user }}' NÃO existe no Active Directory. Operação cancelada."
      # Se a lista de objetos retornada for vazia, o usuário não existe
      when: ad_user_info.objects | length == 0

    - name: Reset password para o usuário {{ target_user }}
      microsoft.ad.user:
        identity: "{{ target_user }}"
        password: "{{ new_password }}"
        update_password: always
        password_expired: yes
        account_locked: no
        state: present
      register: password_result

    - name: Mostrar resultado final
      debug:
        msg: "Senha resetada com sucesso para o usuário '{{ target_user }}'"
      # Só mostra essa mensagem se a tarefa anterior realmente alterou algo
      when: password_result.changed
